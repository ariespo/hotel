<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正式立绘三阶段母版评审</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#07161c;color:#e6edf0}
    *{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 50% 0,#18303a,#07161c 58%)}
    main{max-width:1500px;margin:auto}header{margin-bottom:22px;padding:18px 22px;border:1px solid #506777;border-radius:14px;background:#0b1b23dd}
    h1{margin:0 0 8px}p{margin:5px 0;color:#b6c5cd;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    article{padding:12px;border:1px solid #405662;border-radius:12px;background:#0b171ecc;box-shadow:0 12px 30px #0006}
    img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid #657781;border-radius:8px;background:#10242c}
    h2{margin:10px 0 4px;font-size:18px}small{color:#88a3b0}@media(max-width:850px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><h1>Candidate C · 正式母版三阶段验证</h1><p>三个阶段以前一张全图为编辑目标：先裸头，再加眼睛，最后加头发。用于检查结构是否漂移和画风是否准确；当前尚未接入游戏。</p></header>
  <section class="grid">
    <article><img src="docs/art/portrait-v2-master-review/pipeline-c/01-bare-head-master.png" alt="标准裸头母版"><h2>01 · 标准裸头母版</h2><small>完整头骨、眼窝、耳朵、鼻嘴、颈肩</small></article>
    <article><img src="docs/art/portrait-v2-master-review/pipeline-c/02-formal-eyes-validation.png" alt="正式眼睛验证"><h2>02 · 第一套正式眼睛</h2><small>窄眼、小虹膜、正中视线、匹配眉形</small></article>
    <article><img src="docs/art/portrait-v2-master-review/pipeline-c/03-complete-character-validation.png" alt="完整角色验证"><h2>03 · 第一套正式头发</h2><small>中分基础长发、耳根和五官无遮挡</small></article>
  </section>
</main></body></html>
