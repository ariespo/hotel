<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>立绘 V2 · 六脸型一一对应验收</title>
  <style>:root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#10141a;color:#eff3f8}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at top,#293644,#10141a 58%)}main{max-width:1500px;margin:auto}header{padding:18px 22px;border:1px solid #586979;border-radius:14px;background:#151d25}h1{margin:0 0 8px}p{margin:4px 0;color:#bbc8d2;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}.card{padding:11px;border:1px solid #4d5c69;border-radius:12px;background:#151c23}.board{background-color:#d5d8de;background-image:linear-gradient(45deg,#f1f2f5 25%,transparent 25%),linear-gradient(-45deg,#f1f2f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1f2f5 75%),linear-gradient(-45deg,transparent 75%,#f1f2f5 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.card img{display:block;width:100%;aspect-ratio:1085/1450;object-fit:contain;border:1px solid #73808b;border-radius:8px}.card h2{font-size:18px;margin:10px 0 3px}.card small{color:#9eafbd}@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main>
  <header><h1>六种脸型 · 一一对应验收</h1><p>六张均使用同一套圆瞳、中分长直发、画布与五官锚点。每张脸拥有自己的轮廓、鼻子、嘴巴和独立耳层。</p></header>
  <section class="grid">
    <article class="card board"><img src="docs/art/portrait-v2-master-review/pipeline-g-face-set/composites/round-round-long.png" alt="圆脸组合"><h2>00 · round / 圆脸</h2><small>柔和圆颌、短圆下巴、小巧柔和鼻嘴</small></article>
    <article class="card board"><img src="docs/art/portrait-v2-master-review/pipeline-g-face-set/composites/oval-round-long.png" alt="椭圆脸组合"><h2>01 · oval / 鹅蛋脸</h2><small>纵向椭圆、均衡下颌、平静鼻嘴</small></article>
    <article class="card board"><img src="docs/art/portrait-v2-master-review/pipeline-g-face-set/composites/square-round-long.png" alt="方脸组合"><h2>02 · square / 方脸</h2><small>直侧面、宽下颌与平下巴、宽直鼻</small></article>
    <article class="card board"><img src="docs/art/portrait-v2-master-review/pipeline-g-face-set/composites/sharp-round-long.png" alt="尖脸组合"><h2>03 · sharp / 尖脸</h2><small>收窄下颌、尖而柔和的下巴、细直鼻</small></article>
    <article class="card board"><img src="docs/art/portrait-v2-master-review/pipeline-g-face-set/composites/chubby-round-long.png" alt="团子脸组合"><h2>04 · chubby / 团子脸</h2><small>最饱满脸颊、圆润下颌、饱满嘴型</small></article>
    <article class="card board"><img src="docs/art/portrait-v2-master-review/pipeline-g-face-set/composites/cat-round-long.png" alt="猫系脸组合"><h2>05 · cat / 猫系脸</h2><small>高颧收脸、精巧下巴、轻微上扬嘴角</small></article>
  </section>
</main></body></html>
