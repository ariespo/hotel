  <style>

<body><main>
  <header>
    <h1>Pipeline D · 干净高细节模块母版</h1>
    <p>去除属于皮肤和跨模块的投影，但保留眼睛本身的完整细节。三阶段统一为 1085×1450。</p>
  </header>
  <section class="grid">
    <article><img src="docs/art/portrait-v2-master-review/pipeline-d-clean/01-clean-bare-head-master.png" alt="干净裸头母版"><h2>01 · 干净裸头</h2><small>低噪点，眼区不预烘焙阴影</small></article>
    <article><img src="docs/art/portrait-v2-master-review/pipeline-d-clean/02-clean-detailed-eyes.png" alt="高细节正式眼型"><h2>02 · 高细节眼型</h2><small>锁定眼位，保留眼线、睫毛、虹膜纹理与多点高光</small></article>
    <article><img src="docs/art/portrait-v2-master-review/pipeline-d-clean/03-clean-detailed-complete.png" alt="无跨模块投影的完整角色"><h2>03 · 正式发型合成</h2><small>保留发束设计，不向脸部和服装投影</small></article>
  </section>
</main></body>
