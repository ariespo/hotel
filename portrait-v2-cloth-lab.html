<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>立绘 V2 · 服装母版实验室</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#100f15;color:#f5f1f7}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#342b41,#100f15 52%);min-height:100vh}
    header{padding:14px 22px;background:#17141ddd;border-bottom:1px solid #62536e}
    h1{margin:0 0 5px;font-size:22px}
    p{margin:0;color:#c9bed0;line-height:1.5}
    .warn{color:#ffc889}
    .controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:end}
    label{display:grid;gap:5px;font-size:12px;color:#c9bed0}
    select,input{height:36px;border:1px solid #786784;border-radius:7px;background:#211c29;color:#fff;padding:0 10px}
    button{border:1px solid #786784;border-radius:7px;background:#2a2332;color:#fff;padding:9px 13px;cursor:pointer}
    button:hover{background:#392f43}
    .primary{background:#8e537b;border-color:#bd78a5}
    .primary:hover{background:#a8618e}
    main{max-width:1540px;margin:auto;padding:22px}
    .calibrator{display:grid;grid-template-columns:minmax(300px,520px) minmax(320px,1fr);gap:20px;align-items:start;margin-bottom:24px}
    .preview{border:1px solid #685873;background:#1b1721;border-radius:12px;overflow:hidden}
    .preview canvas{max-height:70vh;object-fit:contain}
    .panel{position:sticky;top:12px;border:1px solid #685873;background:#1b1721;border-radius:12px;padding:18px}
    .panel h2{margin:0 0 14px;font-size:18px}
    .field{display:grid;grid-template-columns:70px 1fr 76px;gap:10px;align-items:center;margin:13px 0}
    .field input[type=range]{width:100%;padding:0}
    .field input[type=number]{width:76px;padding:0 6px}
    .nudge{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,38px);justify-content:center;gap:6px;margin:17px 0}
    .nudge button{padding:0;font-size:18px}
    .nudge [data-dx="-1"]{grid-column:1;grid-row:2}
    .nudge [data-dy="-1"]{grid-column:2;grid-row:1}
    .nudge [data-dy="1"]{grid-column:2;grid-row:3}
    .nudge [data-dx="1"]{grid-column:3;grid-row:2}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
    .status{min-height:24px;margin-top:12px;color:#ffc889}
    .import-label{display:inline-grid;align-items:center;border:1px solid #786784;border-radius:7px;background:#2a2332;color:#fff;padding:8px 13px;cursor:pointer}
    .import-label input{display:none}
    .spec{margin-top:16px;padding:12px;border:1px dashed #786784;border-radius:8px;font-size:13px;color:#c9bed0;line-height:1.55}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{display:block;width:100%;padding:0;text-align:left;border:1px solid #584b62;background:#1b1721;border-radius:12px;overflow:hidden}
    canvas{display:block;width:100%;aspect-ratio:3/4;background:#172734}
    .meta{padding:10px 12px}
    .meta strong{display:block}
    .meta small{color:#a99bb2}
    @media(max-width:820px){main{padding:12px}.calibrator{grid-template-columns:1fr}.panel{position:static}}
  </style>
</head>
<body>
  <header>
    <h1>立绘 V2 · 服装母版实验室</h1>
    <p>用立领蓝袍作为第一套服装母版（保留脖子开孔），叠在正式脸型上面，盖住脸图自带的那截衣领。画布固定 <b>384 × 512</b>。位移 ±400，缩放 0–300（以 100 为基准可调 ±200）。调好后导出，之后所有服装都按这个母版来画。</p>
    <p class="warn">合成顺序：脸 → 眼睛 → 服装 →（可选）头发/耳朵。本页只做母版定位，不改运行时立绘。</p>
    <div class="controls">
      <label>脸型<select id="face"></select></label>
      <label>眼型<select id="eye"></select></label>
      <label>头发<select id="hair"><option value="off">关闭</option></select></label>
      <label>背景<input id="backdrop" type="color" value="#172734"></label>
    </div>
  </header>
  <main>
    <section class="calibrator">
      <div class="preview"><canvas id="preview" width="384" height="512" aria-label="服装与脸部对齐预览"></canvas></div>
      <div class="panel">
        <h2>服装定位</h2>
        <label>当前服装<select id="cloth"></select></label>
        <div class="field"><span>左右 X</span><input id="xRange" type="range" min="-400" max="400" step="1"><input id="xNumber" type="number" min="-400" max="400" step="1"></div>
        <div class="field"><span>上下 Y</span><input id="yRange" type="range" min="-400" max="400" step="1"><input id="yNumber" type="number" min="-400" max="400" step="1"></div>
        <div class="field"><span>整体缩放</span><input id="scaleRange" type="range" min="0" max="300" step="1"><input id="scaleNumber" type="number" min="0" max="300" step="1"></div>
        <div class="nudge" aria-label="逐像素移动">
          <button type="button" data-dy="-1" aria-label="上移一像素">↑</button>
          <button type="button" data-dx="-1" aria-label="左移一像素">←</button>
          <button type="button" data-dx="1" aria-label="右移一像素">→</button>
          <button type="button" data-dy="1" aria-label="下移一像素">↓</button>
        </div>
        <div class="actions">
          <button id="save" type="button" class="primary">保存当前定位</button>
          <button id="reset" type="button">归零并保存</button>
          <button id="export" type="button">导出母版 JSON</button>
          <label class="import-label">导入定位 JSON<input id="import" type="file" accept="application/json"></label>
        </div>
        <p class="status" id="status"></p>
        <div class="spec" id="spec"></div>
      </div>
    </section>
    <section class="grid" id="grid"></section>
  </main>
  <script type="module">
    const FACES = [['round', '圆脸'], ['oval', '鹅蛋脸'], ['square', '方脸'], ['sharp', '尖脸'], ['chubby', '圆润脸'], ['cat', '猫系脸']];
    const EYES = [['round', '圆瞳'], ['almond', '杏眼'], ['sharp', '锐眼'], ['droop', '垂眼'], ['sleepy', '困眼'], ['diamond', '菱形眼']];
    const HAIRS = [['off', '关闭'], ['long', '长直发'], ['bob', '波波头'], ['short', '中短发']];
    const CLOTHES = [['mandarin', '立领蓝袍母版']];
    const CANVAS = { width: 384, height: 512 };
    const FACE_ANCHORS = { chin: [192, 322], neck: [192, 340], shoulderY: 382 };
    const STORAGE_KEY = 'portrait-v2-cloth-offsets-v2';
    const DEFAULT_TRANSFORM = { x: 0, y: 0, scale: 100 };

    const $ = (s) => document.querySelector(s);
    const face = $('#face'), eye = $('#eye'), hair = $('#hair'), cloth = $('#cloth');
    const backdrop = $('#backdrop'), preview = $('#preview'), grid = $('#grid'), status = $('#status'), spec = $('#spec');
    const xRange = $('#xRange'), xNumber = $('#xNumber'), yRange = $('#yRange'), yNumber = $('#yNumber');
    const scaleRange = $('#scaleRange'), scaleNumber = $('#scaleNumber');

    for (const [id, n] of FACES) face.add(new Option(n, id));
    for (const [id, n] of EYES) eye.add(new Option(n, id));
    for (const [id, n] of HAIRS) hair.add(new Option(n, id));
    for (const [id, n] of CLOTHES) cloth.add(new Option(n, id));

    const DEFAULT_OFFSETS = await fetch('assets/portrait-v2-cloth-lab/cloth-offsets.json').then((r) => r.json());
    let offsets = JSON.parse(localStorage.getItem(STORAGE_KEY) || JSON.stringify(DEFAULT_OFFSETS));
    let draft = { ...DEFAULT_TRANSFORM };
    const cache = new Map();

    function load(src) {
      if (cache.has(src)) return cache.get(src);
      const p = new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
      cache.set(src, p);
      return p;
    }

    function savedOffset(id) {
      return { ...DEFAULT_TRANSFORM, ...offsets[id] };
    }

    async function draw(canvas, clothId, offset = savedOffset(clothId), faceId = face.value) {
      const x = canvas.getContext('2d');
      x.fillStyle = backdrop.value;
      x.fillRect(0, 0, CANVAS.width, CANVAS.height);
      const jobs = [
        load(`assets/portrait-v2-cloth-lab/clothes/${clothId}.png`),
        load(`assets/portrait-v2-formal/faces/${faceId}.png`),
        load(`assets/portrait-v2-formal/eyes/${eye.value}.png`),
      ];
      if (hair.value !== 'off') {
        jobs.push(load(`assets/portrait-v2-formal/hair/${hair.value}.png`));
        jobs.push(load(`assets/portrait-v2-formal/ears/${faceId}.png`));
      }
      const [clothLayer, faceLayer, eyeLayer, hairLayer, earLayer] = await Promise.all(jobs);
      x.drawImage(faceLayer, 0, 0);
      x.drawImage(eyeLayer, 0, 0);
      x.save();
      x.translate(192 + offset.x, 256 + offset.y);
      x.scale(offset.scale / 100, offset.scale / 100);
      x.drawImage(clothLayer, -192, -256);
      x.restore();
      if (hairLayer) x.drawImage(hairLayer, 0, 0);
      if (earLayer) x.drawImage(earLayer, 0, 0);
    }

    function masterPayload() {
      return {
        version: 1,
        id: cloth.value,
        canvas: CANVAS,
        layer: 'body',
        drawOrder: ['face', 'eyes', 'cloth', 'hair', 'ears'],
        faceAnchors: FACE_ANCHORS,
        relativeToFace: {
          fromChin: { x: draft.x, y: draft.y },
          scalePercent: draft.scale,
        },
        clothes: offsets,
      };
    }

    function syncInputs() {
      xRange.value = xNumber.value = draft.x;
      yRange.value = yNumber.value = draft.y;
      scaleRange.value = scaleNumber.value = draft.scale;
      status.textContent = `当前草稿：相对脸部 X ${draft.x}px，Y ${draft.y}px，缩放 ${draft.scale}% · 母版 ${CANVAS.width}×${CANVAS.height}`;
      spec.innerHTML = `母版画布 <b>${CANVAS.width} × ${CANVAS.height}</b>。下巴锚点 (192, 322)。服装盖在脸上面，遮住脸图自带的领口。<br>导出后，这套相对脸部的位移和缩放就是后续服装的标准。`;
    }

    function updateDraft(values) {
      draft = { ...draft, ...values };
      syncInputs();
      draw(preview, cloth.value, draft);
    }

    async function render() {
      grid.innerHTML = '';
      const jobs = [];
      for (const [id, name] of FACES) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        const c = document.createElement('canvas');
        c.width = 384;
        c.height = 512;
        card.append(c);
        const meta = document.createElement('div');
        meta.className = 'meta';
        const pos = savedOffset(cloth.value);
        meta.innerHTML = `<strong>${name}</strong><small>${id} · 服装 ${cloth.value} · X ${pos.x} / Y ${pos.y} · ${pos.scale}%</small>`;
        card.append(meta);
        card.onclick = () => { face.value = id; draw(preview, cloth.value, draft, id); };
        grid.append(card);
        jobs.push(draw(c, cloth.value, savedOffset(cloth.value), id));
      }
      await Promise.all(jobs);
      await draw(preview, cloth.value, draft);
    }

    cloth.onchange = () => { draft = { ...savedOffset(cloth.value) }; syncInputs(); render(); };
    xRange.oninput = () => updateDraft({ x: Number(xRange.value) });
    xNumber.oninput = () => updateDraft({ x: Number(xNumber.value) });
    yRange.oninput = () => updateDraft({ y: Number(yRange.value) });
    yNumber.oninput = () => updateDraft({ y: Number(yNumber.value) });
    scaleRange.oninput = () => updateDraft({ scale: Number(scaleRange.value) });
    scaleNumber.oninput = () => updateDraft({ scale: Number(scaleNumber.value) });
    document.querySelectorAll('.nudge button').forEach((button) => {
      button.onclick = () => updateDraft({
        x: draft.x + Number(button.dataset.dx || 0),
        y: draft.y + Number(button.dataset.dy || 0),
      });
    });
    $('#save').onclick = async () => {
      offsets[cloth.value] = { ...draft };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(offsets));
      await render();
      status.textContent = `已保存母版定位：X ${draft.x}px，Y ${draft.y}px，缩放 ${draft.scale}%`;
    };
    $('#reset').onclick = async () => {
      draft = { ...DEFAULT_TRANSFORM };
      offsets[cloth.value] = { ...draft };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(offsets));
      await render();
      status.textContent = '已归零并保存 100% 尺寸';
    };
    $('#export').onclick = () => {
      offsets[cloth.value] = { ...draft };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(masterPayload(), null, 2)], { type: 'application/json' }));
      a.download = 'portrait-v2-cloth-master.json';
      a.click();
      URL.revokeObjectURL(a.href);
    };
    $('#import').onchange = async (event) => {
      const data = JSON.parse(await event.target.files[0].text());
      offsets = data.clothes || data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(offsets));
      draft = { ...savedOffset(cloth.value) };
      syncInputs();
      render();
    };
    face.onchange = () => draw(preview, cloth.value, draft);
    eye.onchange = () => draw(preview, cloth.value, draft);
    hair.onchange = () => draw(preview, cloth.value, draft);
    backdrop.oninput = () => { draw(preview, cloth.value, draft); render(); };
    draft = { ...savedOffset(cloth.value) };
    syncInputs();
    render();
  </script>
</body>
</html>
