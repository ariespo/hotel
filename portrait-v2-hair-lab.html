<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>立绘 V2 · 发型与调色实验室</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#100f15;color:#f5f1f7}*{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#342b41,#100f15 52%);min-height:100vh}
    header{position:sticky;top:0;z-index:5;padding:14px 22px;background:#17141ddd;border-bottom:1px solid #62536e;backdrop-filter:blur(10px)}
    h1{margin:0 0 5px;font-size:22px}p{margin:0;color:#c9bed0;line-height:1.5}.warn{color:#ffc889}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:end}
    label{display:grid;gap:5px;font-size:12px;color:#c9bed0}select,input{height:36px;border:1px solid #786784;border-radius:7px;background:#211c29;color:#fff;padding:0 10px}input[type=color]{width:58px;padding:3px}
    main{max-width:1540px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{border:1px solid #584b62;background:#1b1721;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px #0006}
    canvas{display:block;width:100%;aspect-ratio:3/4;background:#172734}.meta{padding:10px 12px}.meta strong{display:block}.meta small{color:#a99bb2}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px}.swatch{border:1px solid #4d4257;border-radius:7px;padding:7px;text-align:center;font-size:11px;color:#ddd;background:#211c29}.dot{display:block;height:10px;border-radius:5px;margin-bottom:5px}
    @media(max-width:680px){main{padding:12px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>立绘 V2 · 完整发型与调色实验室</h1>
    <p>同一头骨坐标下测试 33 款完整发型。每张卡片固定对照银灰、浅金、深棕和自定义色。</p>
    <p class="warn">本页只使用实验提取层，不覆盖正式发型资源。重点检查发际线、脸部遮挡、耳侧脏边，以及浅色是否发灰、深色是否糊成黑块。</p>
    <div class="controls">
      <label>脸型<select id="face"></select></label><label>眼型<select id="eye"></select></label><label>耳朵层<select id="ears"><option value="off">关闭（默认）</option><option value="under">头发下</option><option value="over">头发上</option></select></label><label>自定义发色<input id="color" type="color" value="#b24f79"></label><label>背景<input id="backdrop" type="color" value="#172734"></label>
    </div>
  </header>
  <main><section class="grid" id="grid"></section></main>
  <script type="module">
    const FACES=[['round','圆脸'],['oval','鹅蛋脸'],['square','方脸'],['sharp','尖脸'],['chubby','圆润脸'],['cat','猫系脸']];
    const EYES=[['round','圆瞳'],['almond','杏眼'],['sharp','锐眼'],['droop','垂眼'],['sleepy','困眼'],['diamond','菱形眼']];
    const HAIRS=[['short','中短层次发'],['bob','波波头'],['long','长直发'],['tail','高马尾'],['twin','双马尾'],['messy','蓬乱层次发'],['buzz','寸头'],['undercut','削边背头'],['topknot','武士髻'],['wolf','狼尾'],['curly','卷毛'],['mohawk','莫霍克'],['braid','长辫'],['spike','刺猬头'],['tall','冲天马尾'],['shaggy','披肩乱发'],['halfup','半扎发'],['viking','维京辫'],['slick','油头'],['afro','爆炸头'],['hime','姬发式'],['dread','脏辫'],['pompadour','飞机头'],['sidelock','双侧长发'],['crop','短碎盖'],['drill','螺旋双卷'],['lowtail','低束马尾'],['butterfly','蝴蝶结双髻'],['jellyfish','水母姬'],['crown','王冠盘发'],['feather','羽状层次发'],['sidebraid','侧编长辫'],['cloud','云朵卷发']];
    const PALETTE=[['银灰','#aeb3bd'],['浅金','#d8b86a'],['深棕','#4b2b26'],['自定',null]];
    const $=s=>document.querySelector(s),face=$('#face'),eye=$('#eye'),ears=$('#ears'),color=$('#color'),backdrop=$('#backdrop'),grid=$('#grid');
    for(const [id,n] of FACES)face.add(new Option(n,id));for(const [id,n] of EYES)eye.add(new Option(n,id));
    const cache=new Map(),tints=new Map();function load(src){if(cache.has(src))return cache.get(src);const p=new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});cache.set(src,p);return p}
    function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}function rgb(hex){return[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}
    async function tintHair(id,hex){const key=id+hex;if(tints.has(key))return tints.get(key);const img=await load(`assets/portrait-v2-hair-lab/hair/${id}.png`),c=document.createElement('canvas');c.width=384;c.height=512;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const pix=x.getImageData(0,0,384,512),d=pix.data,target=rgb(hex),shadow=mix(target,[18,16,22],.62),light=mix(target,[250,248,244],.58),spec=mix(target,[255,255,255],.84);for(let i=0;i<d.length;i+=4){if(d[i+3]<4)continue;const y=d[i]*.299+d[i+1]*.587+d[i+2]*.114;let out;if(y<42)out=mix([10,9,13],shadow,Math.max(0,y/42));else if(y<132)out=mix(shadow,target,(y-42)/90);else if(y<210)out=mix(target,light,(y-132)/78);else out=mix(light,spec,(y-210)/45);d[i]=out[0];d[i+1]=out[1];d[i+2]=out[2]}x.putImageData(pix,0,0);tints.set(key,c);return c}
    async function draw(canvas,hairId,hex){const x=canvas.getContext('2d');x.fillStyle=backdrop.value;x.fillRect(0,0,384,512);const [base,eyeLayer,hair,earLayer]=await Promise.all([load(`assets/portrait-v2-formal/faces/${face.value}.png`),load(`assets/portrait-v2-eye-lab/eyes/${eye.value}.png`),tintHair(hairId,hex),load(`assets/portrait-v2-formal/ears/${face.value}.png`)]);x.drawImage(base,0,0);if(ears.value==='under')x.drawImage(earLayer,0,0);x.drawImage(eyeLayer,0,0);x.drawImage(hair,0,0);if(ears.value==='over')x.drawImage(earLayer,0,0)}
    async function render(){grid.innerHTML='';const jobs=[];for(const [id,name]of HAIRS){for(const [label,fixed]of PALETTE){const hex=fixed||color.value,card=document.createElement('article');card.className='card';const c=document.createElement('canvas');c.width=384;c.height=512;card.append(c);const meta=document.createElement('div');meta.className='meta';meta.innerHTML=`<strong>${name} · ${label}</strong><small>${id} · ${hex}</small>`;card.append(meta);grid.append(card);jobs.push(draw(c,id,hex))}}await Promise.all(jobs)}
    face.onchange=render;eye.onchange=render;ears.onchange=render;color.oninput=()=>{tints.clear();render()};backdrop.oninput=render;render();
  </script>
</body></html>
