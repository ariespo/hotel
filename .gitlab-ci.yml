# Copied into dist by release. Prebuilt static site lives in the dist git repo.
# Must be published at the domain root so /runtime and /engines resolve.
pages:
  stage: deploy
  image: alpine:3.21
  script:
    - test -f CHANGELOG.md
    - test -n "$(find changes -maxdepth 1 -type f -name '*.md' -print -quit)"
    - mkdir -p public
    - |
      find . -mindepth 1 -maxdepth 1 \
        ! -name public \
        ! -name .git \
        ! -name .gitlab-ci.yml \
        ! -name .vercel \
        ! -name .gitignore \
        -exec cp -a {} public/ \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
