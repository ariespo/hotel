# Prebuilt static site (this repo IS the release).
# Must be published at the domain root so /runtime and /engines resolve.
# Use a user/group Pages project named <user>.gitlab.io
pages:
  stage: deploy
  image: alpine:3.21
  script:
    - mkdir -p public
    - |
      find . -mindepth 1 -maxdepth 1 \
        ! -name public \
        ! -name .git \
        ! -name .gitlab-ci.yml \
        ! -name .vercel \
        ! -name .gitignore \
        -exec cp -a {} public/ \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
