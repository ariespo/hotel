<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>绔嬬粯 V2 缁勫悎楠屾敹琛?/title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#17131d;color:#f5edf8}
    *{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at top,#33283e,#17131d 55%)}
    header{max-width:1500px;margin:0 auto 24px;padding:18px 22px;border:1px solid #8e729f;background:#241d2ccc;border-radius:14px}
    h1,h2{margin:0 0 8px}p{margin:4px 0;color:#cdbed5;line-height:1.6}.warning{color:#ffc68f}
    main{max-width:1500px;margin:auto}.section{margin:26px 0}.section h2{position:sticky;top:0;z-index:2;padding:10px 12px;background:#17131dee;border-bottom:1px solid #775e87}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:14px;margin-top:12px}
    .card{padding:9px;border:1px solid #564660;border-radius:10px;background:#211a29;box-shadow:0 5px 18px #0005}
    .card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid #786785;border-radius:7px;background:#d8d4df}
    .card strong{display:block;margin-top:7px;font-size:13px}.card small{display:block;color:#ae9ab8;margin-top:2px;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <header>
    <h1>绔嬬粯 V2 缁勫悎楠屾敹琛?/h1>
    <p>姣忓紶浠?3:4 鍘熷姣斾緥灞曠ず銆傛鏌ヨ劯鈥旇€斥€旈杩炴帴銆佸弻鐪艰惤浣嶃€佸彂闄呯嚎銆侀伄鑴搞€侀厤楗板眰绾т笌椋庢牸涓€鑷存€с€?/p>
    <p class="warning">棣栧姝ｅ紡浣嶅浘浠呭鐧藉悕鍗曠粍鍚堚€滃皷鑴革紜鍦嗙灣锛嬩腑鍒嗭紜闀跨洿鍙戔€濆惎鐢紱鍏朵粬缁勫悎缁х画浣跨敤鍚屽潗鏍囩郴绋嬪簭鍖栧畨鍏ㄧ珛缁橈紝鏃х殑鐙珛鐢熸垚閮ㄤ欢涓嶄細鍙備笌娣锋惌銆?/p>
  </header>
  <main id="sheet"></main>
  <script type="module">
    import { cloneApp, defaultAppearance, PRESETS } from './src/chargen.js';
    import { EYES, FACES, FRINGES, LENGTHS } from './src/face.js';
    import { portraitURL } from './src/portrait-v2.js';

    const sheet = document.querySelector('#sheet');
    const base = defaultAppearance();
    const sections = [
      ['正式位图组合', [
        ...FACES.map((part, face) => ({ label: `${part.name}＋圆瞳＋中分长直发`, detail: `formal face mapping ${face}`, patch: { face, eye: 0, fringe: 1, hairLen: 3 } })),
        { label: '鹅蛋脸＋杏仁眼＋中分短波波头', detail: 'formal raster alternate 01', patch: { face: 1, eye: 1, fringe: 1, hairLen: 2 } },
      ]],
      ['瀹屾暣棰勮', PRESETS.map((preset, index) => ({ label: preset.name, detail: `preset ${index}`, app: preset.make() }))],
      ['鑴稿瀷', FACES.map((part, index) => ({ label: part.name, detail: `${part.id} 路 face ${index}`, patch: { face: index } }))],
      ['鐪煎瀷', EYES.map((part, index) => ({ label: part.name, detail: `${part.id} 路 eye ${index}`, patch: { eye: index } }))],
      ['鍒樻捣', FRINGES.map((part, index) => ({ label: part.name, detail: `${part.id} 路 fringe ${index}`, patch: { fringe: index } }))],
      ['鍙戝瀷', LENGTHS.map((part, index) => ({ label: part.name, detail: `${part.id} 路 hairLen ${index}`, patch: { hairLen: index } }))],
    ];

    for (const [title, entries] of sections) {
      const section = document.createElement('section'); section.className = 'section';
      const heading = document.createElement('h2'); heading.textContent = `${title} 路 ${entries.length}`; section.append(heading);
      const grid = document.createElement('div'); grid.className = 'grid'; section.append(grid);
      for (const entry of entries) {
        const app = entry.app ? cloneApp(entry.app) : Object.assign(cloneApp(base), entry.patch);
        const card = document.createElement('article'); card.className = 'card';
        const img = document.createElement('img'); img.alt = `${title} ${entry.label}`; img.src = portraitURL(app);
        const label = document.createElement('strong'); label.textContent = entry.label;
        const detail = document.createElement('small'); detail.textContent = entry.detail;
        card.append(img, label, detail); grid.append(card);
        setTimeout(() => { img.src = portraitURL(app); }, 900);
      }
      sheet.append(section);
    }
  </script>
</body>
</html>
